name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 
    inputs:
      test_file:
        description: 'Test file/folder to run (e.g., tests/Drodown.spec.ts). Leave blank to run all.'
        required: false
        default: ''

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    # Modified step to dynamically handle either a single test file or all tests
    - name: Run Playwright tests
      run: |
        if [ -n "${{ github.event.inputs.test_file }}" ]; then
          npx playwright test ${{ github.event.inputs.test_file }}
        else
          npx playwright test
        fi

    # Restored your exact artifact configuration
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
